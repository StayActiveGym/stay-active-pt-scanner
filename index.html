<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Stay Active Professional Training</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* ==================================================
   GENERAL
================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {

  background: #000;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  display: flex;

  justify-content: center;

  min-height: 100vh;

}


/* ==================================================
   MAIN CONTAINER
================================================== */

.container {

  width: 100%;

  max-width: 520px;

  min-height: 100vh;

  padding:
    22px
    18px
    30px;

  background: #0b0b0b;

}


/* ==================================================
   HEADER
================================================== */

.header {

  text-align: center;

  margin-bottom: 22px;

}

.logo {

  font-size: 28px;

  font-weight: 900;

  letter-spacing: 1px;

  color: #fff;

}

.logo span {

  color: #ffd400;

}

.subtitle {

  margin-top: 6px;

  font-size: 13px;

  font-weight: 700;

  letter-spacing: 1.5px;

  color: #999;

  text-transform: uppercase;

}


/* ==================================================
   TRAINER SELECTION
================================================== */

.trainer-section {

  margin-bottom: 20px;

}

.section-title {

  text-align: center;

  font-size: 14px;

  font-weight: 800;

  letter-spacing: 1px;

  color: #999;

  margin-bottom: 12px;

  text-transform: uppercase;

}

.trainer-grid {

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 7px;

}

.trainer-btn {

  border: 1px solid #333;

  background: #161616;

  color: #fff;

  border-radius: 8px;

  padding: 14px 4px;

  font-size: 14px;

  font-weight: 900;

  cursor: pointer;

  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease;

}

.trainer-btn:hover {

  border-color: #ffd400;

}

.trainer-btn.active {

  background: #ffd400;

  color: #000;

  border-color: #ffd400;

}


/* ==================================================
   ACTIVE TRAINER
================================================== */

.active-trainer {

  text-align: center;

  margin:
    12px
    0
    18px;

  font-size: 13px;

  color: #888;

}

.active-trainer strong {

  color: #ffd400;

  font-size: 16px;

}


/* ==================================================
   START BUTTON
================================================== */

.start-btn {

  width: 100%;

  border: none;

  border-radius: 10px;

  padding: 17px;

  background: #ffd400;

  color: #000;

  font-size: 16px;

  font-weight: 900;

  letter-spacing: .5px;

  cursor: pointer;

  margin-bottom: 14px;

}

.start-btn:disabled {

  opacity: .35;

  cursor: not-allowed;

}


/* ==================================================
   SCANNER
================================================== */

.scanner-wrapper {

  width: 100%;

  background: #111;

  border:
    1px solid
    #292929;

  border-radius: 14px;

  overflow: hidden;

  margin-bottom: 18px;

}

#reader {

  width: 100%;

}

#reader video {

  width: 100% !important;

  height: auto !important;

  display: block;

}

#reader__scan_region {

  background: #000 !important;

}

#reader__dashboard {

  padding: 10px !important;

  background: #111 !important;

}

#reader__dashboard_section {

  color: #fff !important;

}

#reader__dashboard button {

  background: #ffd400 !important;

  color: #000 !important;

  border: none !important;

  border-radius: 7px !important;

  font-weight: 800 !important;

  padding: 10px 15px !important;

}


/* ==================================================
   STATUS
================================================== */

.status {

  text-align: center;

  min-height: 22px;

  font-size: 13px;

  font-weight: 700;

  color: #999;

  margin-bottom: 14px;

}


/* ==================================================
   RESULT CARD
================================================== */

.result {

  display: none;

  background: #111;

  border:
    1px solid
    #292929;

  border-radius: 14px;

  padding:
    22px
    18px;

  margin-top: 12px;

}

.result.success {

  border-color: #ffd400;

}

.result-title {

  text-align: center;

  color: #ffd400;

  font-size: 21px;

  font-weight: 900;

  margin-bottom: 18px;

  letter-spacing: .5px;

}

.member-name {

  text-align: center;

  font-size: 23px;

  font-weight: 900;

  margin-bottom: 5px;

}

.member-id {

  text-align: center;

  color: #999;

  font-size: 13px;

  margin-bottom: 20px;

}


/* ==================================================
   INFORMATION ROW
================================================== */

.info-row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  padding:
    13px
    0;

  border-bottom:
    1px solid
    #262626;

}

.info-row:last-child {

  border-bottom: none;

}

.info-label {

  color: #999;

  font-size: 13px;

  font-weight: 700;

}

.info-value {

  color: #fff;

  font-size: 15px;

  font-weight: 900;

  text-align: right;

}

.trainer-value {

  color: #ffd400;

}


/* ==================================================
   ZERO CREDIT
================================================== */

.zero-credit {

  color: #ff3030 !important;

  animation:
    blinkCredit
    .8s
    infinite;

}

@keyframes blinkCredit {

  0%,
  49% {

    opacity: 1;

  }

  50%,
  100% {

    opacity: .15;

  }

}


/* ==================================================
   ERROR
================================================== */

.error-box {

  display: none;

  background: #160909;

  border:
    1px solid
    #5a2020;

  border-radius: 12px;

  padding: 16px;

  margin-top: 15px;

  text-align: center;

}

.error-title {

  color: #ff3030;

  font-size: 17px;

  font-weight: 900;

  margin-bottom: 7px;

}

.error-message {

  color: #ccc;

  font-size: 13px;

  line-height: 1.5;

}


/* ==================================================
   SCAN ANOTHER MEMBER
================================================== */

.scan-another {

  display: none;

  width: 100%;

  margin-top: 18px;

  padding: 16px;

  border: none;

  border-radius: 10px;

  background: #ffd400;

  color: #000;

  font-size: 15px;

  font-weight: 900;

  cursor: pointer;

}


/* ==================================================
   FOOTER
================================================== */

.footer {

  text-align: center;

  margin-top: 25px;

  color: #555;

  font-size: 11px;

  letter-spacing: .5px;

}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 420px) {

  .container {

    padding:
      18px
      13px
      25px;

  }

  .logo {

    font-size: 25px;

  }

  .trainer-btn {

    font-size: 12px;

    padding:
      12px
      2px;

  }

  .member-name {

    font-size: 20px;

  }

}

</style>

</head>


<body>

<div class="container">


  <!-- ============================================
       HEADER
  ============================================= -->

  <div class="header">

    <div class="logo">
      STAY <span>ACTIVE</span>
    </div>

    <div class="subtitle">
      Professional Training
    </div>

  </div>


  <!-- ============================================
       TRAINER SELECTION
  ============================================= -->

  <div
    class="trainer-section"
    id="trainerSection"
  >

    <div class="section-title">
      Select PT Trainer
    </div>

    <div class="trainer-grid">

      <button
        type="button"
        class="trainer-btn"
        data-code="PT01"
        onclick="selectTrainer('PT01')"
      >
        PT01
      </button>

      <button
        type="button"
        class="trainer-btn"
        data-code="PT02"
        onclick="selectTrainer('PT02')"
      >
        PT02
      </button>

      <button
        type="button"
        class="trainer-btn"
        data-code="PT03"
        onclick="selectTrainer('PT03')"
      >
        PT03
      </button>

      <button
        type="button"
        class="trainer-btn"
        data-code="PT04"
        onclick="selectTrainer('PT04')"
      >
        PT04
      </button>

      <button
        type="button"
        class="trainer-btn"
        data-code="PT05"
        onclick="selectTrainer('PT05')"
      >
        PT05
      </button>

    </div>

  </div>


  <!-- ============================================
       ACTIVE TRAINER
  ============================================= -->

  <div
    class="active-trainer"
    id="activeTrainer"
  >
    Select a trainer
  </div>


  <!-- ============================================
       START SCANNER
  ============================================= -->

  <button
    type="button"
    class="start-btn"
    id="startButton"
    onclick="startScanner()"
    disabled
  >
    SCAN MEMBER QR CODE
  </button>


  <!-- ============================================
       SCANNER
  ============================================= -->

  <div
    class="scanner-wrapper"
    id="scannerWrapper"
    style="display:none;"
  >

    <div id="reader"></div>

  </div>


  <!-- ============================================
       STATUS
  ============================================= -->

  <div
    class="status"
    id="status"
  >
    Select PT trainer to begin.
  </div>


  <!-- ============================================
       RESULT
  ============================================= -->

  <div
    class="result"
    id="result"
  >

    <div class="result-title">
      LOG-IN SUCCESSFUL
    </div>


    <div
      class="member-name"
      id="resultName"
    >
      —
    </div>


    <div
      class="member-id"
      id="resultMemberId"
    >
      —
    </div>


    <div class="info-row">

      <div class="info-label">
        PT Trainer
      </div>

      <div
        class="info-value trainer-value"
        id="resultTrainer"
      >
        —
      </div>

    </div>


    <div class="info-row">

      <div class="info-label">
        PT Session
      </div>

      <div
        class="info-value"
        id="resultUsed"
      >
        1
      </div>

    </div>


    <div class="info-row">

      <div class="info-label">
        Remaining PT Credit
      </div>

      <div
        class="info-value"
        id="resultRemaining"
      >
        0
      </div>

    </div>


    <div class="info-row">

      <div class="info-label">
        Transaction Time
      </div>

      <div
        class="info-value"
        id="resultTime"
      >
        —
      </div>

    </div>


    <button
      type="button"
      class="scan-another"
      id="scanAnotherButton"
      onclick="scanAnotherMember()"
    >
      SCAN ANOTHER MEMBER
    </button>

  </div>


  <!-- ============================================
       ERROR
  ============================================= -->

  <div
    class="error-box"
    id="errorBox"
  >

    <div class="error-title">
      SCAN NOT COMPLETED
    </div>

    <div
      class="error-message"
      id="errorMessage"
    >
      —
    </div>

  </div>


  <!-- ============================================
       FOOTER
  ============================================= -->

  <div class="footer">
    Always Stay Active • Tara, Gym Na!
  </div>


</div>


<script>

/* ==================================================
   GOOGLE APPS SCRIPT API
================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxq67fyAWDen-vCnW9Qsc8qTM27EN4ZkQof7VzSHVh9g19tzUqH5pdDehQZAxFGJ052jw/exec";


/* ==================================================
   VALID PT TRAINERS
================================================== */

const VALID_PT_CODES = [
  "PT01",
  "PT02",
  "PT03",
  "PT04",
  "PT05"
];


/* ==================================================
   VARIABLES
================================================== */

let selectedPT = "";

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/* ==================================================
   ELEMENTS
================================================== */

const trainerSection =
  document.getElementById(
    "trainerSection"
  );

const activeTrainer =
  document.getElementById(
    "activeTrainer"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const scannerWrapper =
  document.getElementById(
    "scannerWrapper"
  );

const status =
  document.getElementById(
    "status"
  );

const result =
  document.getElementById(
    "result"
  );

const resultName =
  document.getElementById(
    "resultName"
  );

const resultMemberId =
  document.getElementById(
    "resultMemberId"
  );

const resultTrainer =
  document.getElementById(
    "resultTrainer"
  );

const resultUsed =
  document.getElementById(
    "resultUsed"
  );

const resultRemaining =
  document.getElementById(
    "resultRemaining"
  );

const resultTime =
  document.getElementById(
    "resultTime"
  );

const scanAnotherButton =
  document.getElementById(
    "scanAnotherButton"
  );

const errorBox =
  document.getElementById(
    "errorBox"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );


/* ==================================================
   SELECT TRAINER
================================================== */

function selectTrainer(code) {

  code =
    String(
      code || ""
    )
    .trim()
    .toUpperCase();


  /* ----------------------------------------------
     VALIDATE TRAINER
  ---------------------------------------------- */

  if (
    VALID_PT_CODES.indexOf(
      code
    ) === -1
  ) {

    return;

  }


  selectedPT = code;


  /* ----------------------------------------------
     UPDATE TRAINER BUTTON
  ---------------------------------------------- */

  document
    .querySelectorAll(
      ".trainer-btn"
    )
    .forEach(
      function(button) {

        button.classList.remove(
          "active"
        );


        if (
          button.dataset.code ===
          selectedPT
        ) {

          button.classList.add(
            "active"
          );

        }

      }
    );


  /* ----------------------------------------------
     DISPLAY ACTIVE TRAINER
  ---------------------------------------------- */

  activeTrainer.innerHTML =
    "Selected Trainer: <strong>" +
    selectedPT +
    "</strong>";


  /* ----------------------------------------------
     ENABLE SCANNER
  ---------------------------------------------- */

  startButton.disabled =
    false;


  status.textContent =
    "Ready to scan member QR code.";

}


/* ==================================================
   START SCANNER
================================================== */

async function startScanner() {

  /* ----------------------------------------------
     REQUIRE TRAINER
  ---------------------------------------------- */

  if (
    VALID_PT_CODES.indexOf(
      selectedPT
    ) === -1
  ) {

    status.textContent =
      "Please select a PT trainer first.";

    return;

  }


  /* ----------------------------------------------
     PREVENT DOUBLE START
  ---------------------------------------------- */

  if (
    scannerRunning
  ) {

    return;

  }


  hideError();


  result.style.display =
    "none";


  scanAnotherButton.style.display =
    "none";


  scannerWrapper.style.display =
    "block";


  startButton.disabled =
    true;


  status.textContent =
    "Starting camera...";


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  try {

    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 260,
          height: 260
        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


    status.textContent =
      "Scan member QR code.";

  } catch (error) {

    scannerRunning =
      false;


    scannerWrapper.style.display =
      "none";


    startButton.disabled =
      false;


    status.textContent =
      "Unable to start camera.";


    showError(
      error.message ||
      "Camera could not be started."
    );

  }

}


/* ==================================================
   QR SCAN SUCCESS
================================================== */

async function onScanSuccess(
  decodedText
) {

  if (
    processingScan
  ) {

    return;

  }


  processingScan =
    true;


  /* ----------------------------------------------
     SAVE TRAINER FOR THIS TRANSACTION
  ---------------------------------------------- */

  const trainerForThisScan =
    selectedPT;


  if (
    VALID_PT_CODES.indexOf(
      trainerForThisScan
    ) === -1
  ) {

    processingScan =
      false;


    showError(
      "Please select a valid PT trainer."
    );


    return;

  }


  /* ----------------------------------------------
     STOP CAMERA
  ---------------------------------------------- */

  await stopScanner();


  /* ----------------------------------------------
     GET MEMBER ID
  ---------------------------------------------- */

  const memberId =
    extractMemberId(
      decodedText
    );


  if (!memberId) {

    processingScan =
      false;


    showError(
      "Invalid QR code. Member ID was not found."
    );


    startButton.disabled =
      false;


    return;

  }


  status.textContent =
    "Processing PT session...";


  /* ----------------------------------------------
     PROCESS PT TRANSACTION
  ---------------------------------------------- */

  await processPT(
    memberId,
    trainerForThisScan
  );


  processingScan =
    false;

}


/* ==================================================
   QR SCAN FAILURE
================================================== */

function onScanFailure(
  error
) {

  /*
     Scanner continuously calls this while
     looking for a QR code.

     No message is required.
  */

}


/* ==================================================
   STOP SCANNER
================================================== */

async function stopScanner() {

  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  } catch (error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  try {

    await html5QrCode.clear();

  } catch (error) {

    console.log(
      "Scanner clear:",
      error
    );

  }


  scannerRunning =
    false;


  html5QrCode =
    null;


  scannerWrapper.style.display =
    "none";

}


/* ==================================================
   EXTRACT MEMBER ID
================================================== */

function extractMemberId(
  decodedText
) {

  let value =
    String(
      decodedText || ""
    ).trim();


  if (!value) {

    return "";

  }


  /*
     If QR contains:

     memberId=SALFG0001

     extract only the member ID.
  */

  try {

    if (
      value.indexOf(
        "memberId="
      ) !== -1
    ) {

      const parts =
        value.split(
          "memberId="
        );


      if (
        parts.length > 1
      ) {

        value =
          parts[1]
            .split("&")[0]
            .split("#")[0];

      }

    }

  } catch (error) {

    console.log(
      "Member ID extraction:",
      error
    );

  }


  return value.trim();

}


/* ==================================================
   PROCESS PT
================================================== */

function processPT(
  memberId,
  trainerCode
) {

  return new Promise(
    function(resolve) {

      memberId =
        String(
          memberId || ""
        ).trim();


      trainerCode =
        String(
          trainerCode || ""
        )
        .trim()
        .toUpperCase();


      /* ------------------------------------------
         VALIDATE MEMBER
      ------------------------------------------ */

      if (!memberId) {

        showError(
          "Member ID is empty."
        );


        resolve();

        return;

      }


      /* ------------------------------------------
         VALIDATE TRAINER
      ------------------------------------------ */

      if (
        VALID_PT_CODES.indexOf(
          trainerCode
        ) === -1
      ) {

        showError(
          "Invalid PT trainer."
        );


        resolve();

        return;

      }


      /* ------------------------------------------
         UNIQUE CALLBACK
      ------------------------------------------ */

      const callbackName =
        "ptCallback_" +
        Date.now();


      /* ------------------------------------------
         JSONP CALLBACK
      ------------------------------------------ */

      window[callbackName] =
        function(response) {

          try {

            if (
              response &&
              response.success
            ) {

              showSuccess(
                response
              );

            } else {

              showError(

                response &&
                response.message

                  ? response.message

                  : "PT transaction failed."

              );

            }

          } catch (error) {

            showError(
              error.message
            );

          } finally {

            cleanup();

            resolve();

          }

        };


      /* ------------------------------------------
         SCRIPT REQUEST
      ------------------------------------------ */

      const script =
        document.createElement(
          "script"
        );


      script.src =
        API_URL +
        "?action=pt" +
        "&memberId=" +
        encodeURIComponent(
          memberId
        ) +
        "&ptCode=" +
        encodeURIComponent(
          trainerCode
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          showError(
            "Unable to connect to PT server."
          );


          cleanup();

          resolve();

        };


      document.body.appendChild(
        script
      );


      /* ------------------------------------------
         CLEANUP
      ------------------------------------------ */

      function cleanup() {

        try {

          script.remove();

        } catch (error) {}


        try {

          delete window[
            callbackName
          ];

        } catch (error) {}

      }

    }
  );

}


/* ==================================================
   SHOW SUCCESS
================================================== */

function showSuccess(
  response
) {

  /* ----------------------------------------------
     HIDE TRAINER SELECTION
  ---------------------------------------------- */

  trainerSection.style.display =
    "none";


  /* ----------------------------------------------
     SHOW RESULT
  ---------------------------------------------- */

  result.style.display =
    "block";


  result.classList.add(
    "success"
  );


  /* ----------------------------------------------
     MEMBER NAME
  ---------------------------------------------- */

  resultName.textContent =
    response.memberName ||
    "—";


  /* ----------------------------------------------
     MEMBER ID
  ---------------------------------------------- */

  resultMemberId.textContent =
    response.memberId ||
    "—";


  /* ----------------------------------------------
     PT TRAINER
     
     This displays ONLY:
     PT01
     PT02
     PT03
     PT04
     PT05
  ---------------------------------------------- */

  resultTrainer.textContent =
    response.ptCode ||
    selectedPT ||
    "—";


  /* ----------------------------------------------
     CREDIT USED
  ---------------------------------------------- */

  resultUsed.textContent =
    response.creditUsed !== undefined
      ? response.creditUsed
      : 1;


  /* ----------------------------------------------
     REMAINING CREDIT
  ---------------------------------------------- */

  const remaining =
    Number(
      response.remainingCredit || 0
    );


  resultRemaining.textContent =
    remaining;


  /* ----------------------------------------------
     ZERO CREDIT = RED + BLINKING
  ---------------------------------------------- */

  if (
    remaining <= 0
  ) {

    resultRemaining.classList.add(
      "zero-credit"
    );

  } else {

    resultRemaining.classList.remove(
      "zero-credit"
    );

  }


  /* ----------------------------------------------
     TRANSACTION TIME
  ---------------------------------------------- */

  resultTime.textContent =
    formatDateTime(
      response.timestamp
    );


  /* ----------------------------------------------
     SUCCESS MESSAGE
  ---------------------------------------------- */

  status.textContent =
    "1 PT Session is credited today. You still have " +
    remaining +
    " remaining PT Credit.";


  /* ----------------------------------------------
     SCAN ANOTHER MEMBER
  ---------------------------------------------- */

  scanAnotherButton.style.display =
    "block";


  startButton.style.display =
    "none";

}


/* ==================================================
   SCAN ANOTHER MEMBER
================================================== */

function scanAnotherMember() {

  /*
     Keep the same selected trainer.

     Trainer selection remains hidden.

     To choose another trainer, refresh
     the page.
  */

  result.style.display =
    "none";


  hideError();


  scanAnotherButton.style.display =
    "none";


  scannerWrapper.style.display =
    "none";


  startButton.style.display =
    "block";


  startButton.disabled =
    false;


  activeTrainer.innerHTML =
    "Selected Trainer: <strong>" +
    selectedPT +
    "</strong>";


  status.textContent =
    "Ready to scan another member.";


  window.scrollTo(
    {
      top: 0,
      behavior: "smooth"
    }
  );

}


/* ==================================================
   SHOW ERROR
================================================== */

function showError(
  message
) {

  errorBox.style.display =
    "block";


  errorMessage.textContent =
    message ||
    "Something went wrong.";


  status.textContent =
    "Please try again.";


  startButton.style.display =
    "block";


  startButton.disabled =
    false;

}


/* ==================================================
   HIDE ERROR
================================================== */

function hideError() {

  errorBox.style.display =
    "none";

}


/* ==================================================
   FORMAT DATE / TIME
================================================== */

function formatDateTime(
  value
) {

  if (!value) {

    return "—";

  }


  try {

    const date =
      new Date(value);


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return String(
        value
      );

    }


    return date.toLocaleString(
      "en-PH",
      {
        year: "numeric",
        month: "numeric",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }
    );

  } catch (error) {

    return String(
      value
    );

  }

}

</script>
