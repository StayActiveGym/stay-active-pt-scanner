<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Stay Active PT Trainer</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background: #111;
  color: #fff;
}


/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 520px;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  text-align: center;
  margin-bottom: 20px;
}

.logo-title {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo-title span {
  color: #ffd400;
}

.subtitle {
  margin-top: 5px;
  color: #aaa;
  font-size: 14px;
}


/* =========================================================
   CARD
========================================================= */

.card {
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 20px;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.35);
}


/* =========================================================
   LABEL
========================================================= */

.label {
  font-size: 13px;
  color: #aaa;
  font-weight: bold;
  margin-bottom: 10px;
  text-transform: uppercase;
}


/* =========================================================
   TRAINER BUTTONS
========================================================= */

.trainer-grid {
  display: grid;
  grid-template-columns:
    repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.trainer-btn {
  border: 1px solid #444;
  background: #252525;
  color: #fff;
  padding: 13px 5px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
}

.trainer-btn:hover {
  background: #333;
}

.trainer-btn.active {
  background: #ffd400;
  color: #111;
  border-color: #ffd400;
}


/* =========================================================
   SELECTED TRAINER
========================================================= */

.selected-trainer {
  text-align: center;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 18px;
}

.selected-trainer span {
  color: #ffd400;
}


/* =========================================================
   SCANNER
========================================================= */

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 15px;
  background: #000;
  border: 2px solid #333;
}

#reader video {
  width: 100% !important;
  border-radius: 13px;
}

#reader__scan_region {
  min-height: 260px;
}

#reader__dashboard {
  background: #181818;
  padding: 10px !important;
}

#reader__dashboard button {
  background: #ffd400 !important;
  color: #111 !important;
  border: none !important;
  border-radius: 8px !important;
  padding: 10px 14px !important;
  font-weight: 800 !important;
}


/* =========================================================
   SCAN MESSAGE
========================================================= */

.scan-message {
  text-align: center;
  margin-top: 15px;
  color: #aaa;
  font-size: 14px;
}


/* =========================================================
   BUTTONS
========================================================= */

.button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 12px;
  transition: 0.2s;
}

.button-primary {
  background: #ffd400;
  color: #111;
}

.button-primary:hover {
  background: #ffdf33;
}

.button-secondary {
  background: #333;
  color: #fff;
}

.button-secondary:hover {
  background: #444;
}

.button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}


/* =========================================================
   RESULT
========================================================= */

.result {
  display: none;
  text-align: center;
}

.result-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin: 0 auto 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 42px;
  font-weight: 900;
}

.result.success .result-icon {
  background: #ffd400;
  color: #111;
}

.result.error .result-icon {
  background: #b52a2a;
  color: #fff;
}

.result-title {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 10px;
}

.result-message {
  color: #bbb;
  line-height: 1.5;
  margin-bottom: 18px;
}


/* =========================================================
   MEMBER DETAILS
========================================================= */

.member-box {
  background: #252525;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
  text-align: left;
}

.member-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 9px 0;
  border-bottom: 1px solid #3a3a3a;
}

.member-row:last-child {
  border-bottom: none;
}

.member-label {
  color: #999;
  font-size: 13px;
}

.member-value {
  font-weight: 800;
  text-align: right;
  word-break: break-word;
}

.credit {
  color: #ffd400;
  font-size: 18px;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
  display: none;
  text-align: center;
  padding: 30px 10px;
}

.spinner {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: 5px solid #444;
  border-top-color: #ffd400;
  animation:
    spin 0.8s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================================
   SERVER STATUS
========================================================= */

.server-status {
  margin-top: 15px;
  text-align: center;
  font-size: 12px;
  color: #777;
}

.server-status.online {
  color: #7fdc7f;
}

.server-status.offline {
  color: #ff7777;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 420px) {

  .app {
    padding: 10px;
  }

  .card {
    padding: 15px;
  }

  .logo-title {
    font-size: 25px;
  }

  .trainer-btn {
    padding: 12px 3px;
    font-size: 12px;
  }

}

</style>

</head>


<body>

<div class="app">

  <div class="container">

    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="header">

      <div class="logo-title">
        STAY ACTIVE <span>PT</span>
      </div>

      <div class="subtitle">
        Professional Training Session Scanner
      </div>

    </div>


    <!-- =================================================
         MAIN CARD
    ================================================== -->

    <div class="card">


      <!-- ===============================================
           TRAINER SELECTION
      ================================================ -->

      <div id="trainerSection">

        <div class="label">
          Select PT Trainer
        </div>

        <div class="trainer-grid">

          <button
            class="trainer-btn"
            data-trainer="PT01">
            PT01
          </button>

          <button
            class="trainer-btn"
            data-trainer="PT02">
            PT02
          </button>

          <button
            class="trainer-btn"
            data-trainer="PT03">
            PT03
          </button>

          <button
            class="trainer-btn"
            data-trainer="PT04">
            PT04
          </button>

          <button
            class="trainer-btn"
            data-trainer="PT05">
            PT05
          </button>

        </div>


        <div class="selected-trainer">
          Selected:
          <span id="selectedTrainer">
            None
          </span>
        </div>


        <button
          id="startScannerBtn"
          class="button button-primary"
          disabled>

          OPEN QR SCANNER

        </button>

      </div>


      <!-- ===============================================
           SCANNER SECTION
      ================================================ -->

      <div
        id="scannerSection"
        style="display:none;">

        <div class="label">
          Scan Member QR Code
        </div>

        <div id="reader"></div>

        <div class="scan-message">
          Point the camera at the member's QR code.
        </div>

        <button
          id="changeTrainerBtn"
          class="button button-secondary">

          CHANGE TRAINER

        </button>

      </div>


      <!-- ===============================================
           LOADING
      ================================================ -->

      <div
        id="loading"
        class="loading">

        <div class="spinner"></div>

        <div>
          Recording PT session...
        </div>

      </div>


      <!-- ===============================================
           RESULT
      ================================================ -->

      <div
        id="result"
        class="result">

        <div
          id="resultIcon"
          class="result-icon">
          ✓
        </div>

        <div
          id="resultTitle"
          class="result-title">
          PT SESSION RECORDED
        </div>

        <div
          id="resultMessage"
          class="result-message">
        </div>


        <div
          id="memberBox"
          class="member-box">

          <div class="member-row">

            <div class="member-label">
              Member
            </div>

            <div
              id="memberName"
              class="member-value">
            </div>

          </div>


          <div class="member-row">

            <div class="member-label">
              Member ID
            </div>

            <div
              id="memberId"
              class="member-value">
            </div>

          </div>


          <div class="member-row">

            <div class="member-label">
              PT Trainer
            </div>

            <div
              id="trainerResult"
              class="member-value">
            </div>

          </div>


          <div class="member-row">

            <div class="member-label">
              Remaining Credit
            </div>

            <div
              id="remainingCredit"
              class="member-value credit">
            </div>

          </div>

        </div>


        <button
          id="scanNextBtn"
          class="button button-primary">

          SCAN NEXT MEMBER

        </button>


        <button
          id="resultChangeTrainerBtn"
          class="button button-secondary">

          CHANGE TRAINER

        </button>

      </div>


      <!-- ===============================================
           SERVER STATUS
      ================================================ -->

      <div
        id="serverStatus"
        class="server-status">

        Checking PT Scanner server...

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   API URL
   IMPORTANT:
   THIS IS THE CURRENT APPS SCRIPT DEPLOYMENT
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbztbXY2-5lG_g8WVRiwxUGDjdTZhJnigiSEVpuHAc_xrhumXlVA2paFuQHwJo0bl0P7/exec";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let selectedTrainer = "";

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/* =========================================================
   ELEMENTS
========================================================= */

const trainerButtons =
  document.querySelectorAll(
    ".trainer-btn"
  );

const selectedTrainerEl =
  document.getElementById(
    "selectedTrainer"
  );

const startScannerBtn =
  document.getElementById(
    "startScannerBtn"
  );

const trainerSection =
  document.getElementById(
    "trainerSection"
  );

const scannerSection =
  document.getElementById(
    "scannerSection"
  );

const loading =
  document.getElementById(
    "loading"
  );

const result =
  document.getElementById(
    "result"
  );

const resultIcon =
  document.getElementById(
    "resultIcon"
  );

const resultTitle =
  document.getElementById(
    "resultTitle"
  );

const resultMessage =
  document.getElementById(
    "resultMessage"
  );

const memberBox =
  document.getElementById(
    "memberBox"
  );

const memberName =
  document.getElementById(
    "memberName"
  );

const memberId =
  document.getElementById(
    "memberId"
  );

const trainerResult =
  document.getElementById(
    "trainerResult"
  );

const remainingCredit =
  document.getElementById(
    "remainingCredit"
  );

const serverStatus =
  document.getElementById(
    "serverStatus"
  );

const changeTrainerBtn =
  document.getElementById(
    "changeTrainerBtn"
  );

const resultChangeTrainerBtn =
  document.getElementById(
    "resultChangeTrainerBtn"
  );

const scanNextBtn =
  document.getElementById(
    "scanNextBtn"
  );


/* =========================================================
   TRAINER SELECTION
========================================================= */

trainerButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      function() {

        trainerButtons.forEach(
          btn => {

            btn.classList.remove(
              "active"
            );

          }
        );


        this.classList.add(
          "active"
        );


        selectedTrainer =
          this.dataset.trainer;


        selectedTrainerEl.textContent =
          selectedTrainer;


        startScannerBtn.disabled =
          false;

      }
    );

  }
);


/* =========================================================
   START SCANNER
========================================================= */

startScannerBtn.addEventListener(
  "click",
  async function() {

    if (!selectedTrainer) {

      alert(
        "Please select a PT Trainer first."
      );

      return;

    }


    trainerSection.style.display =
      "none";

    scannerSection.style.display =
      "block";

    result.style.display =
      "none";

    loading.style.display =
      "none";


    await startScanner();

  }
);


/* =========================================================
   START CAMERA
========================================================= */

async function startScanner() {

  await stopScanner();


  const reader =
    document.getElementById(
      "reader"
    );


  reader.innerHTML = "";


  html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  try {

    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning = true;


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );


    scannerRunning = false;


    alert(
      "Unable to open the camera.\n\n" +
      "Please allow camera permission and reload the page."
    );

  }

}


/* =========================================================
   QR SCAN SUCCESS
========================================================= */

function onScanSuccess(
  decodedText
) {

  if (processingScan) {
    return;
  }


  processingScan = true;


  console.log(
    "QR scanned:",
    decodedText
  );


  stopScanner();


  scannerSection.style.display =
    "none";

  loading.style.display =
    "block";


  sendPTScan(
    decodedText
  );

}


/* =========================================================
   QR SCAN FAILURE
========================================================= */

function onScanFailure(error) {

  // Normal while searching for a QR code.
  // No action needed.

}


/* =========================================================
   SEND PT SCAN
========================================================= */

function sendPTScan(
  qrValue
) {

  const callbackName =
    "ptScannerCallback_" +
    Date.now();


  let finished = false;


  const script =
    document.createElement(
      "script"
    );


  /* -------------------------------------------------------
     JSONP CALLBACK
  ------------------------------------------------------- */

  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      cleanup();


      console.log(
        "PT API response:",
        data
      );


      if (
        !data ||
        typeof data !== "object"
      ) {

        showConnectionError(
          "The PT Scanner server returned an invalid response."
        );

        return;

      }


      handlePTResponse(
        data
      );

    };


  /* -------------------------------------------------------
     CLEANUP
  ------------------------------------------------------- */

  function cleanup() {

    clearTimeout(
      timeout
    );


    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }


    try {

      delete window[callbackName];

    } catch (error) {

      window[callbackName] =
        undefined;

    }

  }


  /* -------------------------------------------------------
     TIMEOUT
  ------------------------------------------------------- */

  const timeout =
    setTimeout(
      function() {

        if (finished) {
          return;
        }


        finished = true;


        cleanup();


        showConnectionError(
          "The PT Scanner server did not respond within 15 seconds."
        );

      },
      15000
    );


  /* -------------------------------------------------------
     SCRIPT ERROR
  ------------------------------------------------------- */

  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      cleanup();


      showConnectionError(
        "Unable to connect to the PT Scanner server."
      );

    };


  /* -------------------------------------------------------
     API URL
  ------------------------------------------------------- */

  const url =
    API_URL +
    "?action=scan" +
    "&trainer=" +
      encodeURIComponent(
        selectedTrainer
      ) +
    "&qrValue=" +
      encodeURIComponent(
        qrValue
      ) +
    "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
    "&_=" +
      Date.now();


  console.log(
    "PT API request:",
    url
  );


  script.src =
    url;


  document.body.appendChild(
    script
  );

}


/* =========================================================
   HANDLE API RESPONSE
========================================================= */

function handlePTResponse(
  data
) {

  loading.style.display =
    "none";


  if (
    data.success === true
  ) {

    showSuccess(
      data
    );

  } else {

    showError(
      data
    );

  }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(
  data
) {

  result.className =
    "result success";


  resultIcon.textContent =
    "✓";


  resultTitle.textContent =
    "PT SESSION RECORDED";


  resultMessage.textContent =
    data.message ||
    "Professional Training session recorded successfully.";


  memberName.textContent =
    data.memberName ||
    "-";


  memberId.textContent =
    data.memberId ||
    "-";


  trainerResult.textContent =
    data.trainer ||
    selectedTrainer ||
    "-";


  remainingCredit.textContent =
    formatCredit(
      data.remainingCredit
    );


  memberBox.style.display =
    "block";


  result.style.display =
    "block";


  processingScan =
    false;

}


/* =========================================================
   ERROR
========================================================= */

function showError(
  data
) {

  result.className =
    "result error";


  resultIcon.textContent =
    "!";


  resultTitle.textContent =
    getErrorTitle(
      data.code
    );


  resultMessage.textContent =
    data.message ||
    "The PT session could not be recorded.";


  memberName.textContent =
    data.memberName ||
    "-";


  memberId.textContent =
    data.memberId ||
    "-";


  trainerResult.textContent =
    data.trainer ||
    selectedTrainer ||
    "-";


  remainingCredit.textContent =
    formatCredit(
      data.remainingCredit
    );


  memberBox.style.display =
    "block";


  result.style.display =
    "block";


  processingScan =
    false;

}


/* =========================================================
   CONNECTION ERROR
========================================================= */

function showConnectionError(
  message
) {

  loading.style.display =
    "none";


  result.className =
    "result error";


  resultIcon.textContent =
    "!";


  resultTitle.textContent =
    "PT SESSION NOT RECORDED";


  resultMessage.textContent =
    message;


  memberBox.style.display =
    "none";


  result.style.display =
    "block";


  processingScan =
    false;

}


/* =========================================================
   ERROR TITLES
========================================================= */

function getErrorTitle(
  code
) {

  switch (code) {

    case "MEMBER_NOT_FOUND":
      return "MEMBER NOT FOUND";

    case "NO_PT":
      return "NO PT CREDIT";

    case "NO_CREDIT":
      return "NO REMAINING CREDIT";

    case "INVALID_TRAINER":
      return "INVALID TRAINER";

    case "INVALID_QR":
      return "INVALID QR CODE";

    case "INVALID_CREDIT":
      return "INVALID PT CREDIT";

    case "NAME_NOT_FOUND":
      return "MEMBER NAME NOT FOUND";

    default:
      return "PT SESSION NOT RECORDED";

  }

}


/* =========================================================
   FORMAT CREDIT
========================================================= */

function formatCredit(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  return String(value);

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  } catch (error) {

    console.warn(
      "Scanner stop warning:",
      error
    );

  }


  try {

    await html5QrCode.clear();

  } catch (error) {

    console.warn(
      "Scanner clear warning:",
      error
    );

  }


  scannerRunning =
    false;

  html5QrCode =
    null;

}


/* =========================================================
   SCAN NEXT MEMBER
========================================================= */

scanNextBtn.addEventListener(
  "click",
  async function() {

    processingScan =
      false;


    result.style.display =
      "none";

    loading.style.display =
      "none";

    scannerSection.style.display =
      "block";


    await startScanner();

  }
);


/* =========================================================
   CHANGE TRAINER
========================================================= */

async function changeTrainer() {

  await stopScanner();


  processingScan =
    false;


  result.style.display =
    "none";

  loading.style.display =
    "none";

  scannerSection.style.display =
    "none";

  trainerSection.style.display =
    "block";

}


changeTrainerBtn.addEventListener(
  "click",
  changeTrainer
);


resultChangeTrainerBtn.addEventListener(
  "click",
  changeTrainer
);


/* =========================================================
   TEST SERVER
========================================================= */

function checkServer() {

  const callbackName =
    "ptPingCallback_" +
    Date.now();


  let finished = false;


  const script =
    document.createElement(
      "script"
    );


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }


      finished = true;


      cleanup();


      console.log(
        "PT API ping:",
        data
      );


      if (
        data &&
        data.success === true
      ) {

        serverStatus.textContent =
          "PT Scanner server online";

        serverStatus.className =
          "server-status online";

      } else {

        serverStatus.textContent =
          "PT Scanner server returned an error";

        serverStatus.className =
          "server-status offline";

      }

    };


  function cleanup() {

    clearTimeout(
      timeout
    );


    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }


    try {

      delete window[callbackName];

    } catch (error) {

      window[callbackName] =
        undefined;

    }

  }


  const timeout =
    setTimeout(
      function() {

        if (finished) {
          return;
        }


        finished = true;


        cleanup();


        serverStatus.textContent =
          "PT Scanner server offline";

        serverStatus.className =
          "server-status offline";

      },
      8000
    );


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      cleanup();


      serverStatus.textContent =
        "PT Scanner server offline";

      serverStatus.className =
        "server-status offline";

    };


  script.src =
    API_URL +
    "?action=ping" +
    "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
    "&_=" +
      Date.now();


  document.body.appendChild(
    script
  );

}
