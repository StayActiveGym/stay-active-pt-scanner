<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Stay Active PT Trainer</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overscroll-behavior: none;
}

button {
  font-family: inherit;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  text-align: center;
  padding: 15px 0 25px;
}

.logo {
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  color: #f5c400;
}

.subtitle {
  margin-top: 7px;
  color: #999;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}


/* =========================================================
   SCREENS
========================================================= */

.screen {
  display: none;
  width: 100%;
}

.screen.active {
  display: block;
}


/* =========================================================
   CARD
========================================================= */

.card {
  background: #0d0d0d;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 22px;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title {
  margin-bottom: 14px;
  color: #999;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1.5px;
}


/* =========================================================
   PT TRAINER SELECTION
========================================================= */

.pt-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 22px;
}

.pt-button {
  appearance: none;
  -webkit-appearance: none;

  display: block;

  width: 100%;
  min-height: 56px;

  border: 2px solid #333;
  border-radius: 9px;

  padding: 15px 4px;

  background: #111;
  color: #fff;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;

  position: relative;
  z-index: 20;

  pointer-events: auto;

  user-select: none;
  -webkit-user-select: none;

  touch-action: manipulation;

  transition:
    background 0.15s ease,
    border-color 0.15s ease,
    color 0.15s ease,
    transform 0.08s ease;
}

.pt-button:hover {
  border-color: #f5c400;
}

.pt-button:active {
  transform: scale(0.96);
}

.pt-button:focus {
  outline: none;
}

.pt-button:focus-visible {
  border-color: #f5c400;
}

.pt-button.selected {
  background: #f5c400;
  border-color: #f5c400;
  color: #000;
}


/* =========================================================
   SELECTED TEXT
========================================================= */

#selectedText {
  text-align: center;
  color: #777;
  font-size: 13px;
  min-height: 18px;
}


/* =========================================================
   MAIN BUTTON
========================================================= */

.main-button {
  width: 100%;
  margin-top: 18px;

  padding: 17px;

  border: 0;
  border-radius: 10px;

  background: #f5c400;
  color: #000;

  font-size: 16px;
  font-weight: 900;

  cursor: pointer;

  touch-action: manipulation;

  transition:
    opacity 0.15s ease,
    transform 0.08s ease;
}

.main-button:hover:not(:disabled) {
  background: #ffd21a;
}

.main-button:active:not(:disabled) {
  transform: scale(0.98);
}

.main-button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}


/* =========================================================
   SECONDARY BUTTON
========================================================= */

.secondary-button {
  width: 100%;
  margin-top: 12px;

  padding: 15px;

  border: 2px solid #333;
  border-radius: 10px;

  background: #111;
  color: #fff;

  font-size: 15px;
  font-weight: 900;

  cursor: pointer;

  touch-action: manipulation;
}

.secondary-button:hover {
  border-color: #f5c400;
  color: #f5c400;
}

.secondary-button:active {
  transform: scale(0.98);
}


/* =========================================================
   CAMERA
========================================================= */

.camera-title {
  text-align: center;
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 8px;
}

.selected-training {
  text-align: center;
  margin-bottom: 18px;

  color: #f5c400;

  font-size: 14px;
  font-weight: 900;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: #050505;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  border-radius: 12px;
  display: block;
}

#reader img {
  max-width: 100%;
}

#reader__dashboard {
  display: none !important;
}

.camera-status {
  margin-top: 12px;

  color: #777;

  text-align: center;

  font-size: 12px;
  line-height: 1.5;
}


/* =========================================================
   SUCCESS
========================================================= */

.success-icon {
  width: 70px;
  height: 70px;

  margin: 5px auto 20px;

  border-radius: 50%;

  background: #f5c400;
  color: #000;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 38px;
  font-weight: 900;
}

.status-title {
  text-align: center;
  margin-bottom: 20px;

  font-size: 24px;
  font-weight: 900;
}

.info-row {
  margin-top: 8px;

  padding: 13px;

  border-radius: 9px;

  background: #151515;
}

.info-label {
  color: #777;

  font-size: 10px;
  font-weight: bold;

  text-transform: uppercase;
}

.info-value {
  margin-top: 5px;

  font-size: 17px;
  font-weight: 900;

  word-break: break-word;
}


/* =========================================================
   CREDIT
========================================================= */

.credit-row {
  margin-top: 10px;

  padding: 16px 13px;

  border-radius: 9px;

  background: #151515;

  border: 1px solid #333;

  text-align: center;
}

.credit-label {
  color: #999;

  font-size: 10px;
  font-weight: bold;

  text-transform: uppercase;

  letter-spacing: 1px;
}

.credit-value {
  margin-top: 6px;

  color: #f5c400;

  font-size: 28px;
  font-weight: 900;
}

.credit-unit {
  margin-left: 4px;

  color: #fff;

  font-size: 13px;
  font-weight: bold;
}


/* =========================================================
   ZERO CREDIT
========================================================= */

.credit-value.zero {
  color: #ff3333;

  animation: blinkCredit 1s infinite;
}

@keyframes blinkCredit {

  0%,
  49% {
    opacity: 1;
  }

  50%,
  100% {
    opacity: 0.2;
  }

}


/* =========================================================
   ERROR
========================================================= */

.error-title {
  margin-bottom: 15px;

  color: #ff3333;

  text-align: center;

  font-size: 23px;
  font-weight: 900;
}

.error-message {
  color: #ddd;

  text-align: center;

  font-size: 15px;

  line-height: 1.5;
}


/* =========================================================
   PROCESSING
========================================================= */

.processing-title {
  padding: 25px 0 10px;

  text-align: center;

  font-size: 24px;
  font-weight: 900;
}

.processing-text {
  padding-bottom: 20px;

  color: #999;

  text-align: center;

  font-size: 14px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  margin-top: auto;

  padding-top: 25px;

  color: #555;

  text-align: center;

  font-size: 10px;
  font-weight: bold;

  letter-spacing: 1px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 400px) {

  .app {
    padding: 15px;
  }

  .card {
    padding: 18px;
  }

  .pt-grid {
    gap: 6px;
  }

  .pt-button {
    min-height: 54px;
    font-size: 13px;
    padding: 14px 2px;
  }

}

</style>

</head>


<body>

<div class="app">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <div class="header">

    <div class="logo">
      STAY <span>ACTIVE</span>
    </div>

    <div class="subtitle">
      PT TRAINER
    </div>

  </div>


  <!-- =====================================================
       SELECTION SCREEN
  ====================================================== -->

  <div
    id="selectionScreen"
    class="screen active"
  >

    <div class="card">

      <div class="section-title">
        SELECT PT TRAINER
      </div>


      <div class="pt-grid">

        <button
          type="button"
          class="pt-button"
          data-pt="PT01"
        >
          PT01
        </button>

        <button
          type="button"
          class="pt-button"
          data-pt="PT02"
        >
          PT02
        </button>

        <button
          type="button"
          class="pt-button"
          data-pt="PT03"
        >
          PT03
        </button>

        <button
          type="button"
          class="pt-button"
          data-pt="PT04"
        >
          PT04
        </button>

        <button
          type="button"
          class="pt-button"
          data-pt="PT05"
        >
          PT05
        </button>

      </div>


      <div id="selectedText">
        Select a PT trainer
      </div>


      <button
        id="startButton"
        type="button"
        class="main-button"
        disabled
      >
        SCAN CLIENT QR CODE
      </button>

    </div>

  </div>


  <!-- =====================================================
       SCANNER SCREEN
  ====================================================== -->

  <div
    id="scannerScreen"
    class="screen"
  >

    <div class="card">

      <div class="camera-title">
        SCAN CLIENT QR CODE
      </div>

      <div
        id="scannerPT"
        class="selected-training"
      ></div>

      <div id="reader"></div>

      <div
        id="cameraStatus"
        class="camera-status"
      >
        Starting camera...
      </div>

      <button
        id="cancelButton"
        type="button"
        class="secondary-button"
      >
        CANCEL
      </button>

    </div>

  </div>


  <!-- =====================================================
       PROCESSING SCREEN
  ====================================================== -->

  <div
    id="processingScreen"
    class="screen"
  >

    <div class="card">

      <div class="processing-title">
        PROCESSING...
      </div>

      <div class="processing-text">
        Recording PT Trainer session.
      </div>

    </div>

  </div>


  <!-- =====================================================
       SUCCESS SCREEN
  ====================================================== -->

  <div
    id="successScreen"
    class="screen"
  >

    <div class="card">

      <div class="success-icon">
        ✓
      </div>

      <div class="status-title">
        PT SESSION RECORDED
      </div>


      <div class="info-row">

        <div class="info-label">
          MEMBER
        </div>

        <div
          id="successMember"
          class="info-value"
        ></div>

      </div>


      <div class="info-row">

        <div class="info-label">
          PT TRAINER
        </div>

        <div
          id="successPT"
          class="info-value"
        ></div>

      </div>


      <div class="credit-row">

        <div class="credit-label">
          PROFESSIONAL TRAINING REMAINING CREDIT
        </div>

        <div
          id="successCredit"
          class="credit-value"
        >
          0
          <span class="credit-unit">
            SESSIONS
          </span>
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          TIME
        </div>

        <div
          id="successTime"
          class="info-value"
        ></div>

      </div>


      <button
        id="scanAnotherButton"
        type="button"
        class="main-button"
      >
        SCAN ANOTHER CLIENT
      </button>

    </div>

  </div>


  <!-- =====================================================
       ERROR SCREEN
  ====================================================== -->

  <div
    id="errorScreen"
    class="screen"
  >

    <div class="card">

      <div class="error-title">
        PT SESSION NOT PROCESSED
      </div>

      <div
        id="errorMessage"
        class="error-message"
      ></div>


      <button
        id="tryAgainButton"
        type="button"
        class="main-button"
      >
        TRY AGAIN
      </button>

    </div>

  </div>


  <div class="footer">
    ALWAYS STAY ACTIVE
  </div>

</div>


<script>

/* =========================================================
   APPS SCRIPT URL
========================================================= */

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbztbXY2-5lG_g8WVRiwxUGDjdTZhJnigiSEVpuHAc_xrhumXlVA2paFuQHwJo0bl0P7/exec";


/* =========================================================
   VARIABLES
========================================================= */

let selectedPT = "";

let scanner = null;

let scannerRunning = false;

let processing = false;


/* =========================================================
   DOM READY
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    initializeApp();

  }
);


/* =========================================================
   INITIALIZE APP
========================================================= */

function initializeApp() {

  /*
   * PT BUTTONS
   */

  const ptButtons =
    document.querySelectorAll(
      ".pt-button"
    );


  ptButtons.forEach(
    function(button) {

      button.addEventListener(
        "click",
        function(event) {

          event.preventDefault();
          event.stopPropagation();

          const ptCode =
            button.getAttribute(
              "data-pt"
            );

          if (!ptCode) {
            return;
          }

          selectPT(
            ptCode,
            button
          );

        },
        false
      );

    }
  );


  /*
   * START
   */

  document
    .getElementById("startButton")
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        if (!selectedPT) {
          return;
        }

        startScanner();

      }
    );


  /*
   * CANCEL
   */

  document
    .getElementById("cancelButton")
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        cancelScanner();

      }
    );


  /*
   * SCAN ANOTHER
   */

  document
    .getElementById("scanAnotherButton")
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        scanAnother();

      }
    );


  /*
   * TRY AGAIN
   */

  document
    .getElementById("tryAgainButton")
    .addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        scanAnother();

      }
    );

}


/* =========================================================
   SELECT PT TRAINER
========================================================= */

function selectPT(
  ptCode,
  button
) {

  selectedPT = String(
    ptCode
  ).trim();


  /*
   * Remove previous selection
   */

  document
    .querySelectorAll(
      ".pt-button"
    )
    .forEach(
      function(btn) {

        btn.classList.remove(
          "selected"
        );

      }
    );


  /*
   * Highlight selected button
   */

  button.classList.add(
    "selected"
  );


  /*
   * Update selected text
   */

  document.getElementById(
    "selectedText"
  ).textContent =
    "Selected PT Trainer: " +
    selectedPT;


  /*
   * Enable scanner button
   */

  document.getElementById(
    "startButton"
  ).disabled = false;

}


/* =========================================================
   SHOW SCREEN
========================================================= */

function showScreen(
  screenId
) {

  document
    .querySelectorAll(
      ".screen"
    )
    .forEach(
      function(screen) {

        screen.classList.remove(
          "active"
        );

      }
    );


  const target =
    document.getElementById(
      screenId
    );


  if (target) {

    target.classList.add(
      "active"
    );

  }

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

  if (!selectedPT) {

    showError(
      "Please select a PT Trainer first."
    );

    return;

  }


  processing = false;


  await stopScanner();


  document.getElementById(
    "scannerPT"
  ).textContent =
    "Selected PT Trainer: " +
    selectedPT;


  document.getElementById(
    "cameraStatus"
  ).textContent =
    "Starting camera...";


  document.getElementById(
    "reader"
  ).innerHTML = "";


  showScreen(
    "scannerScreen"
  );


  /*
   * Create scanner
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * First attempt:
   * Environment / rear camera
   */

  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        handleScan(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Normal QR scanning failures
         * are ignored.
         */

      }

    );


    scannerRunning = true;


    document.getElementById(
      "cameraStatus"
    ).textContent =
      "Camera ready. Scan client QR code.";


    return;

  }

  catch (environmentError) {

    console.error(
      "Environment camera failed:",
      environmentError
    );

  }


  /*
   * Second attempt:
   * Detect available cameras
   */

  try {

    await stopScanner();


    document.getElementById(
      "reader"
    ).innerHTML = "";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    document.getElementById(
      "cameraStatus"
    ).textContent =
      "Selecting available camera...";


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera was detected on this device."
      );

    }


    /*
     * Try to find rear camera
     */

    let selectedCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ""
            ).toLowerCase();

          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          );

        }
      );


    /*
     * If no rear camera,
     * use first available camera.
     */

    if (!selectedCamera) {

      selectedCamera =
        cameras[0];

    }


    await scanner.start(

      selectedCamera.id,

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        handleScan(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Normal QR scanning errors
         * are ignored.
         */

      }

    );


    scannerRunning = true;


    document.getElementById(
      "cameraStatus"
    ).textContent =
      "Camera ready. Scan client QR code.";

  }

  catch (error) {

    console.error(
      "Camera startup failed:",
      error
    );


    let message =
      "Unable to access the camera.";


    if (
      error &&
      error.name === "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. Please allow camera access for this website and try again.";

    }

    else if (
      error &&
      error.name === "NotFoundError"
    ) {

      message =
        "No camera was found on this device.";

    }

    else if (
      error &&
      error.name === "NotReadableError"
    ) {

      message =
        "The camera is currently being used by another application.";

    }

    else if (
      error &&
      error.name === "SecurityError"
    ) {

      message =
        "The browser blocked camera access. Please make sure this page is using HTTPS.";

    }

    else if (
      error &&
      error.message
    ) {

      message =
        error.message;

    }


    showError(
      message
    );

  }

}


/* =========================================================
   HANDLE QR SCAN
========================================================= */

async function handleScan(
  decodedText
) {

  /*
   * Prevent duplicate scans.
   */

  if (processing) {
    return;
  }


  processing = true;


  /*
   * Stop camera immediately.
   */

  await stopScanner();


  /*
   * Read QR value.
   */

  const memberId =
    String(
      decodedText || ""
    ).trim();


  if (!memberId) {

    showError(
      "The QR code does not contain a valid Member ID."
    );

    return;

  }


  /*
   * Send to Apps Script.
   */

  processPTSession(
    memberId
  );

}


/* =========================================================
   SEND PT SESSION TO APPS SCRIPT
========================================================= */

function processPTSession(
  memberId
) {

  showScreen(
    "processingScreen"
  );


  /*
   * JSONP callback name
   */

  const callbackName =
    "ptCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  /*
   * Create global callback.
   */

  window[callbackName] =
    function(response) {

      try {

        handleServerResponse(
          response
        );

      }

      catch (error) {

        console.error(
          "Response handling error:",
          error
        );

        showError(
          "The PT server returned an invalid response."
        );

      }

      finally {

        try {

          delete window[
            callbackName
          ];

        }

        catch (error) {

          console.log(
            "Callback cleanup:",
            error
          );

        }

      }

    };


  /*
   * Build request URL.
   */

  const url =
    SCRIPT_URL +
    "?action=pt" +
    "&memberId=" +
    encodeURIComponent(
      memberId
    ) +
    "&ptCode=" +
    encodeURIComponent(
      selectedPT
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();


  /*
   * JSONP script
   */

  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;

  script.async =
    true;


  /*
   * Connection failure
   */

  script.onerror =
    function() {

      try {

        delete window[
          callbackName
        ];

      }

      catch (error) {

        console.log(
          "Callback cleanup:",
          error
        );

      }


      showError(
        "Unable to connect to the PT server."
      );

    };


  /*
   * Timeout protection
   */

  const timeout =
    setTimeout(
      function() {

        if (
          window[callbackName]
        ) {

          try {

            delete window[
              callbackName
            ];

          }

          catch (error) {

            console.log(
              "Callback cleanup:",
              error
            );

          }


          showError(
            "The PT server did not respond. Please try again."
          );

        }

      },
      15000
    );


  /*
   * Clear timeout when callback runs.
   */

  const originalCallback =
    window[callbackName];


  window[callbackName] =
    function(response) {

      clearTimeout(
        timeout
      );

      originalCallback(
        response
      );

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   SERVER RESPONSE
========================================================= */

function handleServerResponse(
  response
) {

  console.log(
    "PT Server Response:",
    response
  );


  /*
   * Server returned an error.
   */

  if (
    !response ||
    response.success !== true
  ) {

    const message =
      response &&
      response.message
        ? response.message
        : "Unable to record the PT session.";


    showError(
      message
    );


    return;

  }


  /*
   * MEMBER
   */

  document.getElementById(
    "successMember"
  ).textContent =
    response.memberName || "";


  /*
   * PT TRAINER
   */

  document.getElementById(
    "successPT"
  ).textContent =
    response.ptCode ||
    selectedPT;


  /*
   * PROFESSIONAL TRAINING CREDIT
   *
   * Expected Apps Script response:
   *
   * professionalTrainingCredit
   *
   * This should represent DATA column BF
   * after the PT session has been recorded.
   */

  const creditElement =
    document.getElementById(
      "successCredit"
    );


  let credit =
    Number(
      response.professionalTrainingCredit
    );


  /*
   * Handle numeric strings.
   */

  if (
    !Number.isFinite(
      credit
    )
  ) {

    credit = 0;

  }


  /*
   * Do not allow negative display.
   */

  if (credit < 0) {

    credit = 0;

  }


  const sessionText =
    credit === 1
      ? "SESSION"
      : "SESSIONS";


  creditElement.innerHTML =
    String(credit) +
    ' <span class="credit-unit">' +
    sessionText +
    "</span>";


  /*
   * Zero credit warning.
   */

  if (credit <= 0) {

    creditElement.classList.add(
      "zero"
    );

  }

  else {

    creditElement.classList.remove(
      "zero"
    );

  }


  /*
   * TIME
   */

  document.getElementById(
    "successTime"
  ).textContent =
    formatTime(
      response.timestamp
    );


  /*
   * Show success.
   */

  showScreen(
    "successScreen"
  );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
  value
) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return String(
      value
    );

  }


  return date.toLocaleString(
    "en-PH",
    {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    }
  );

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

  if (!scanner) {

    scannerRunning = false;

    return;

  }


  /*
   * Stop camera.
   */

  if (scannerRunning) {

    try {

      await scanner.stop();

    }

    catch (error) {

      console.log(
        "Scanner stop:",
        error
      );

    }

  }


  /*
   * Clear scanner.
   */

  try {

    await scanner.clear();

  }

  catch (error) {

    console.log(
      "Scanner clear:",
      error
    );

  }


  scanner = null;

  scannerRunning = false;

}


/* =========================================================
   CANCEL SCANNER
========================================================= */

async function cancelScanner() {

  processing = false;


  await stopScanner();


  document.getElementById(
    "reader"
  ).innerHTML = "";


  showScreen(
    "selectionScreen"
  );

}


/* =========================================================
   SCAN ANOTHER CLIENT
========================================================= */

async function scanAnother() {

  processing = false;


  await stopScanner();


  /*
   * Keep the selected PT trainer.
   *
   * This makes it faster for a PT trainer
   * to scan multiple clients.
   */

  document.getElementById(
    "reader"
  ).innerHTML = "";


  document.getElementById(
    "selectedText"
  ).textContent =
    selectedPT
      ? "Selected PT Trainer: " +
        selectedPT
      : "Select a PT trainer";


  /*
   * Keep selected button highlighted.
   */

  document
    .querySelectorAll(
      ".pt-button"
    )
    .forEach(
      function(button) {

        const buttonPT =
          button.getAttribute(
            "data-pt"
          );


        if (
          buttonPT === selectedPT
        ) {

          button.classList.add(
            "selected"
          );

        }

        else {

          button.classList.remove(
            "selected"
          );

        }

      }
    );


  /*
   * Keep Start button enabled
   * if PT is selected.
   */

  document.getElementById(
    "startButton"
  ).disabled =
    !selectedPT;


  showScreen(
    "selectionScreen"
  );

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
  message
) {

  processing = false;


  document.getElementById(
    "errorMessage"
  ).textContent =
    message ||
    "Unable to process the PT session.";


  showScreen(
    "errorScreen"
  );

}

</script>
