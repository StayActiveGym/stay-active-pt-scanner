```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Stay Active PT Trainer</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
}


/* =========================================================
   HEADER
========================================================= */

.header {
  text-align: center;
  padding: 15px 0 25px;
}

.logo {
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  color: #f5c400;
}

.subtitle {
  margin-top: 7px;
  color: #999;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}


/* =========================================================
   SCREENS
========================================================= */

.screen {
  display: none;
}

.screen.active {
  display: block;
}


/* =========================================================
   CARD
========================================================= */

.card {
  background: #0d0d0d;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 22px;
}


/* =========================================================
   PT TRAINER SELECTION
========================================================= */

.section-title {
  margin-bottom: 12px;
  color: #999;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1.5px;
}

.pt-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  margin-bottom: 22px;
}

.pt-button {
  border: 2px solid #333;
  border-radius: 9px;
  padding: 15px 4px;
  background: #111;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
}

.pt-button.selected {
  background: #f5c400;
  border-color: #f5c400;
  color: #000;
}


/* =========================================================
   BUTTONS
========================================================= */

.main-button {
  width: 100%;
  margin-top: 18px;
  padding: 17px;
  border: 0;
  border-radius: 10px;
  background: #f5c400;
  color: #000;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

.main-button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.secondary-button {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: 2px solid #333;
  border-radius: 10px;
  background: #111;
  color: #fff;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
}


/* =========================================================
   CAMERA
========================================================= */

.camera-title {
  text-align: center;
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 8px;
}

.selected-training {
  text-align: center;
  margin-bottom: 18px;
  color: #f5c400;
  font-size: 14px;
  font-weight: 900;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  background: #050505;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  border-radius: 12px;
  display: block;
}

#reader img {
  max-width: 100%;
}


/* =========================================================
   CAMERA STATUS
========================================================= */

.camera-status {
  margin-top: 12px;
  color: #777;
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
}


/* =========================================================
   SUCCESS
========================================================= */

.success-icon {
  width: 70px;
  height: 70px;
  margin: 5px auto 20px;
  border-radius: 50%;
  background: #f5c400;
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: 900;
}

.status-title {
  text-align: center;
  margin-bottom: 20px;
  font-size: 24px;
  font-weight: 900;
}

.info-row {
  margin-top: 8px;
  padding: 13px;
  border-radius: 9px;
  background: #151515;
}

.info-label {
  color: #777;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
}

.info-value {
  margin-top: 5px;
  font-size: 17px;
  font-weight: 900;
  word-break: break-word;
}


/* =========================================================
   PROFESSIONAL TRAINING REMAINING CREDIT
========================================================= */

.credit-row {
  margin-top: 10px;
  padding: 16px 13px;
  border-radius: 9px;
  background: #151515;
  border: 1px solid #333;
  text-align: center;
}

.credit-label {
  color: #999;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.credit-value {
  margin-top: 6px;
  color: #f5c400;
  font-size: 28px;
  font-weight: 900;
}

.credit-unit {
  margin-left: 4px;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
}


/* =========================================================
   ZERO CREDIT
========================================================= */

.credit-value.zero {
  color: #ff3333;
  animation: blinkCredit 1s infinite;
}

@keyframes blinkCredit {

  0%,
  49% {
    opacity: 1;
  }

  50%,
  100% {
    opacity: 0.2;
  }

}


/* =========================================================
   ERROR
========================================================= */

.error-title {
  margin-bottom: 15px;
  color: #ff3333;
  text-align: center;
  font-size: 23px;
  font-weight: 900;
}

.error-message {
  color: #ddd;
  text-align: center;
  font-size: 15px;
  line-height: 1.5;
}


/* =========================================================
   PROCESSING
========================================================= */

.processing-title {
  padding: 25px 0 10px;
  text-align: center;
  font-size: 24px;
  font-weight: 900;
}

.processing-text {
  padding-bottom: 20px;
  color: #999;
  text-align: center;
  font-size: 14px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
  margin-top: auto;
  padding-top: 25px;
  color: #555;
  text-align: center;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
}

</style>

</head>


<body>

<div class="app">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <div class="header">

    <div class="logo">
      STAY <span>ACTIVE</span>
    </div>

    <div class="subtitle">
      PT TRAINER
    </div>

  </div>


  <!-- =====================================================
       PT TRAINER SELECTION SCREEN
  ====================================================== -->

  <div
    id="selectionScreen"
    class="screen active"
  >

    <div class="card">

      <div class="section-title">
        SELECT PT TRAINER
      </div>


      <div class="pt-grid">

        <button
          class="pt-button"
          onclick="selectPT('PT01', this)"
        >
          PT01
        </button>

        <button
          class="pt-button"
          onclick="selectPT('PT02', this)"
        >
          PT02
        </button>

        <button
          class="pt-button"
          onclick="selectPT('PT03', this)"
        >
          PT03
        </button>

        <button
          class="pt-button"
          onclick="selectPT('PT04', this)"
        >
          PT04
        </button>

        <button
          class="pt-button"
          onclick="selectPT('PT05', this)"
        >
          PT05
        </button>

      </div>


      <div
        id="selectedText"
        style="
          text-align:center;
          color:#777;
          font-size:13px;
        "
      >
        Select a PT trainer
      </div>


      <button
        id="startButton"
        class="main-button"
        disabled
        onclick="startScanner()"
      >
        SCAN CLIENT QR CODE
      </button>

    </div>

  </div>


  <!-- =====================================================
       SCANNER SCREEN
  ====================================================== -->

  <div
    id="scannerScreen"
    class="screen"
  >

    <div class="card">

      <div class="camera-title">
        SCAN CLIENT QR CODE
      </div>

      <div
        id="scannerPT"
        class="selected-training"
      ></div>

      <div id="reader"></div>

      <div
        id="cameraStatus"
        class="camera-status"
      >
        Starting camera...
      </div>


      <button
        class="secondary-button"
        onclick="cancelScanner()"
      >
        CANCEL
      </button>

    </div>

  </div>


  <!-- =====================================================
       PROCESSING SCREEN
  ====================================================== -->

  <div
    id="processingScreen"
    class="screen"
  >

    <div class="card">

      <div class="processing-title">
        PROCESSING...
      </div>

      <div class="processing-text">
        Recording PT Trainer session.
      </div>

    </div>

  </div>


  <!-- =====================================================
       SUCCESS SCREEN
  ====================================================== -->

  <div
    id="successScreen"
    class="screen"
  >

    <div class="card">

      <div class="success-icon">
        ✓
      </div>

      <div class="status-title">
        PT SESSION RECORDED
      </div>


      <div class="info-row">

        <div class="info-label">
          MEMBER
        </div>

        <div
          id="successMember"
          class="info-value"
        ></div>

      </div>


      <div class="info-row">

        <div class="info-label">
          PT TRAINER
        </div>

        <div
          id="successPT"
          class="info-value"
        ></div>

      </div>


      <!-- =================================================
           PROFESSIONAL TRAINING REMAINING CREDIT
           SOURCE: DATA COLUMN BF
      ================================================== -->

      <div class="credit-row">

        <div class="credit-label">
          PROFESSIONAL TRAINING REMAINING CREDIT
        </div>

        <div
          id="successCredit"
          class="credit-value"
        >
          0
          <span class="credit-unit">
            SESSION
