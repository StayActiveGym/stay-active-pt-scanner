.pt-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 22px;
}

.pt-button {
  appearance: none;
  -webkit-appearance: none;

  display: block;

  width: 100%;
  min-height: 56px;

  border: 2px solid #333;
  border-radius: 9px;

  padding: 15px 4px;

  background: #111;
  color: #fff;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;

  position: relative;
  z-index: 20;

  pointer-events: auto;

  user-select: none;
  -webkit-user-select: none;

  touch-action: manipulation;

  transition:
    background 0.15s ease,
    border-color 0.15s ease,
    color 0.15s ease,
    transform 0.08s ease;
}

.pt-button:hover {
  border-color: #f5c400;
}

.pt-button:active {
  transform: scale(0.96);
}

.pt-button:focus {
  outline: none;
}

.pt-button:focus-visible {
  border-color: #f5c400;
}

.pt-button.selected {
  background: #f5c400;
  border-color: #f5c400;
  color: #000;
}

  cursor: pointer;

  touch-action: manipulation;

  transition:

}

.main-button:hover:not(:disabled) {

}

.main-button:active:not(:disabled) {

}

.main-button:disabled {

}
